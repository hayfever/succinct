version: 2

# Keep the pinned workflow actions current. Each action is pinned to a commit
# SHA in .github/workflows/, so a Dependabot bump must keep the SHA and the
# version comment in step.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      npm:
        patterns: ["*"]
