name: Release

# Drafts a GitHub release from the matching CHANGELOG.md section when a v-tag
# is pushed. The full matrix in validate.yml must pass first, so a red build
# blocks the release. Bump versions with scripts/bump-version.py first.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Extract the changelog section
        run: |
          python3 - <<'EOF'
          import os, re
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          pattern = rf"(?ms)^## \[{re.escape(version)}\].*?\n(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, text)
          if not match:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          body = match.group(1).strip()
          # Drop the trailing compare-link footer, which is repo noise.
          body = re.sub(r"^\[[^\]]+\]: .*$", "", body, flags=re.MULTILINE).strip()
          open("release-notes.md", "w", encoding="utf-8").write(body + "\n")
          print(f"extracted {len(body)} characters for v{version}")
          EOF
      - name: Draft the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          generate_release_notes: true
          body_path: release-notes.md
